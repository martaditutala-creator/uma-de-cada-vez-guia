<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Uma de Cada Vez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--sand:#E6DDD2;--paper:#F8F4EF;--paper-2:#EFE8DF;--ink:#3A2E28;--ink-soft:#6E5F55;--accent:#8A6650;--line:#D9CEC2}
@media (prefers-color-scheme: dark){:root{--sand:#1F1A17;--paper:#2A231F;--paper-2:#342B26;--ink:#EDE4DA;--ink-soft:#B8A99C;--accent:#D3AE91;--line:#463A33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sand);color:var(--ink);font-family:"Jost",Arial,sans-serif;font-weight:300;padding:16px}
.card{background:var(--paper);width:100%;max-width:420px;padding:36px 28px;border-radius:4px;box-shadow:0 10px 30px rgba(58,46,40,.12);text-align:center}
.k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:500}
h1{font-family:"Gilda Display",Georgia,serif;font-weight:400;font-size:34px;margin:10px 0 6px}
p{color:var(--ink-soft);line-height:1.5;margin:0 0 22px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:4px;text-align:center}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);margin:14px 0 18px}
button{width:100%;font:inherit;font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:14px;border:0;border-radius:4px;background:var(--accent);color:var(--paper);cursor:pointer}
button[disabled]{opacity:.6}
.err{color:#B4553F;font-size:14px;min-height:20px;margin:12px 0 0}
.foot{font-size:12px;margin:22px 0 0}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="k">Workbook interativo</div>
  <h1>Uma de Cada Vez</h1>
  <p>Escreve a palavra-passe que recebeste com a tua compra.</p>
  <input id="pw" type="password" placeholder="palavra-passe" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label><input id="rem" type="checkbox" checked> Lembrar neste aparelho</label>
  <button id="b" type="submit">Abrir o meu guia</button>
  <div class="err" id="e"></div>
  <p class="foot">Problemas? Instagram <strong>@martaditutala._</strong></p>
</form>

var K="udcv-acesso";
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function open(pw){
  var e=new TextEncoder();
  var bk=await crypto.subtle.importKey("raw",e.encode(pw.normalize("NFC").trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},k,u8(P.d)));
  return html;
}
function show(html){var h=location.hash;document.open();document.write(html);document.close();if(h){setTimeout(function(){var t=document.getElementById(h.slice(1));if(t)t.scrollIntoView()},50)}}
function get(){try{return localStorage.getItem(K)}catch(x){return null}}
function set(v){try{v?localStorage.setItem(K,v):localStorage.removeItem(K)}catch(x){}}
(async function(){
  var saved=get();
  if(saved){try{show(await open(saved));return}catch(x){set(null)}}
  document.getElementById("f").addEventListener("submit",async function(ev){
    ev.preventDefault();
    var b=document.getElementById("b"),er=document.getElementById("e"),pw=document.getElementById("pw").value;
    b.disabled=true;b.textContent="A abrir…";er.textContent="";
    try{var html=await open(pw);if(document.getElementById("rem").checked)set(pw);show(html)}
    catch(x){er.textContent="Palavra-passe errada. Confirma e tenta de novo.";b.disabled=false;b.textContent="Abrir o meu guia"}
  });
})();
